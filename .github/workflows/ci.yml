name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: lint + unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: syntax check
        run: |
          for f in dietpex.sh install.sh helpers/*.sh lang/*.sh tests/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: shellcheck
        run: |
          command -v shellcheck || sudo apt-get install -y shellcheck >/dev/null
          shellcheck dietpex.sh install.sh helpers/*.sh tests/*.sh

      - name: unit tests
        run: bash tests/unit.sh

      - name: dry-run smoke on runner
        run: sudo ./dietpex.sh --dry-run --purge

      - name: installer help smoke
        run: |
          bash install.sh --help
          bash install.sh --lang th --help

  integration:
    name: real trim (systemd)
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted Ubuntu runners run systemd as PID 1, so the real trim
      # can be exercised directly without docker or third-party images.
      - name: run integration tests
        run: sudo bash tests/integration.sh
