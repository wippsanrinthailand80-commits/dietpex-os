name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: lint + unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: syntax check
        run: |
          for f in dietpex.sh install.sh helpers/*.sh lang/*.sh tests/*.sh build/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: shellcheck
        run: |
          command -v shellcheck || sudo apt-get install -y shellcheck >/dev/null
          shellcheck dietpex.sh install.sh helpers/*.sh tests/*.sh build/*.sh

      - name: unit tests
        run: bash tests/unit.sh

      - name: dry-run smoke on runner
        run: sudo ./dietpex.sh --dry-run --purge

      - name: installer help smoke
        run: |
          bash install.sh --help
          bash install.sh --lang th --help

      - name: report tool smoke (read-only)
        run: bash helpers/report.sh

  integration:
    name: real trim (systemd)
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted Ubuntu runners run systemd as PID 1, so the real trim
      # can be exercised directly without docker or third-party images.
      - name: run integration tests
        run: sudo bash tests/integration.sh

  browser-purge:
    name: browser purge verification
    runs-on: ubuntu-24.04
    needs: integration
    steps:
      - uses: actions/checkout@v4

      - name: install browser test packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            firefox chromium-browser google-chrome-stable >/dev/null 2>&1 || true

      - name: run browser purge test
        run: sudo bash tests/browser-purge-test.sh

  screenshots:
    name: visual tests (screenshots)
    runs-on: ubuntu-24.04
    needs: integration
    steps:
      - uses: actions/checkout@v4

      - name: install chromium + Thai fonts
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            chromium-browser fonts-noto-core libharfbuzz-bin >/dev/null

      - name: run dietpex trim (setup)
        run: sudo bash dietpex.sh --purge > /dev/null 2>&1

      - name: install Thai i18n
        run: sudo bash helpers/i18n.sh install-thai > /dev/null 2>&1

      - name: install XFCE UI
        run: sudo bash helpers/ui.sh install > /dev/null 2>&1

      - name: capture screenshots
        run: sudo bash tests/screenshot-tests.sh

      - name: upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: dietpex-screenshots
          path: tests/screenshots/*.png
          retention-days: 30
          if-no-files-found: warn

  ram-benchmark:
    name: XFCE app RAM benchmark
    runs-on: ubuntu-24.04
    needs: screenshots
    steps:
      - uses: actions/checkout@v4

      - name: install Xorg + XFCE + screenshot tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xserver-xorg-video-dummy xfce4 xfce4-goodies \
            xvfb scrot gnome-screenshot libharfbuzz-bin >/dev/null 2>&1

      - name: run RAM benchmark
        run: sudo bash tests/ram-benchmark.sh

      - name: upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: dietpex-ram-benchmark
          path: |
            tests/screenshots/ram-benchmark-results.tsv
            tests/screenshots/ram-benchmark-results.md
            tests/screenshots/ram-benchmark/
          retention-days: 30
          if-no-files-found: warn

  os-image:
    name: real OS (build ISO + VM desktop screenshots)
    runs-on: ubuntu-24.04
    needs: integration
    steps:
      - uses: actions/checkout@v4

      - name: install build + VM tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            live-build qemu-system-x86 socat imagemagick \
            squashfs-tools genisoimage xorriso >/dev/null

      - name: build dietpex OS ISO
        run: sudo bash build/os-image.sh
        env:
          OUT_ISO: ${{ github.workspace }}/dietpex-os.iso
          WORK_DIR: /tmp/dietpex-build

      - name: boot ISO in QEMU and capture desktop screenshots
        run: sudo bash tests/os-boot-screenshot.sh "${{ github.workspace }}/dietpex-os.iso" tests/screenshots-os
        env:
          WORK_DIR: /tmp/dietpex-vm

      - name: upload OS desktop screenshots
        uses: actions/upload-artifact@v4
        with:
          name: dietpex-os-desktop
          path: |
            tests/screenshots-os/*.png
            tests/screenshots-os/*.log
          retention-days: 30
          if-no-files-found: warn

      - name: upload built ISO
        uses: actions/upload-artifact@v4
        with:
          name: dietpex-os-iso
          path: dietpex-os.iso
          retention-days: 14
          if-no-files-found: warn
