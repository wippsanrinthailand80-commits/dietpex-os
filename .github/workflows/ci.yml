name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: lint + unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: syntax check
        run: |
          for f in dietpex.sh install.sh helpers/*.sh lang/*.sh tests/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: shellcheck
        run: |
          command -v shellcheck || sudo apt-get install -y shellcheck >/dev/null
          shellcheck dietpex.sh install.sh helpers/*.sh tests/*.sh

      - name: unit tests
        run: bash tests/unit.sh

      - name: dry-run smoke on runner
        run: sudo ./dietpex.sh --dry-run --purge

      - name: installer help smoke
        run: |
          bash install.sh --help
          bash install.sh --lang th --help

  integration:
    name: real trim in systemd container
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: boot systemd Ubuntu container
        run: |
          docker run -d --name dietpex --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD":/dietpex:rw \
            ubuntu:24.04 /sbin/init
          st="starting"
          for i in $(seq 1 90); do
            st="$(docker exec dietpex systemctl is-system-running 2>/dev/null || true)"
            case "$st" in
              running|degraded) break ;;
            esac
            sleep 2
          done
          echo "systemd state: $st"
          case "$st" in
            running|degraded) ;;
            *) docker logs dietpex | tail -40; exit 1 ;;
          esac

      - name: run integration tests
        run: |
          docker exec dietpex bash -c 'cd /dietpex && bash tests/integration.sh'
