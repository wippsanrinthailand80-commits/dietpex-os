name: Android Emulator

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  phone-emulator:
    name: boot phone emulator + smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Boot Pixel 5 emulator (API 34) and run smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb devices
            adb shell input keyevent 82
            adb shell getprop ro.product.model
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.fingerprint
            adb shell wm size
            mkdir -p phone-test
            adb exec-out screencap -p > phone-test/phone-screen.png
            test -s phone-test/phone-screen.png

      - name: Upload phone screenshot
        uses: actions/upload-artifact@v4
        with:
          name: phone-emulator-screenshot
          path: phone-test/phone-screen.png
          retention-days: 30
          if-no-files-found: error
